### env template

llm:
  temperature:
  enableThinking:
  activeProvider: # from 0 to n-1, where n is the number of providers
  providers:
    - provider:
      baseUrl:
      apiKey:
      models: [] # if empty, all models will be used
    - provider:
      baseUrl:
      apiKey:
      models: []

template:
  basePath:
  suffix:
  tList:
    - id:
      description:
      tFiles: [] # 一般按照的格式为: {role}_{id}

jwt:
  secret:
  ttl: # second
  passFilter: [] # uri prefix compare, no base uri here
  cookieOption:
    accessKey:
    maxAge: # second
    path:
    domain: # cors
    secure: # https
    httpOnly:

server:
  host:
  port:
  baseUri: # backend base uri prefix
  readTimeout: # second
  writeTimeout: # second
  idleTimeout: # second
  maxHeaderBytes:
  rpc:
    enable:
    type:
    host:
    port:
    middleware:
      auth:
        enable:
        passFilter: []
      logger:
        enable:
      recovery:
        enable:

rpc:
  enable:
  type:
  address:

web:
  serverStatic: # server static dist or not
  dist: # relative path to ./
  entry: # web entry file, relative to dist, e.g. index.html

database:
  enable:
  type:
  enableLog:
  logLevel:
  slowThreshold: # miliseconds
  autoMigrate:
  mysql:
    dsn:
    maxIdleConns:
    maxOpenConns:
    connMaxLifetime: # second
  sqlite:
    path: # path for database name.

# redis oss license
valkey:
  enable:
  address:
  username:
  password:
  database:

# aliyun oss
aliyunOss:
  enable:
  address:
  region:
  accessKeyId:
  accessKeySecret:
  roleArn:
  sessionName:
  bucket:
  validMimes: []
  bucketPrefix: # if empty, the default prefix is YYYY-MM-DD.
  maxSize:
  expires: # second for presign
  callback:

httpProxy:
  timeout: # second

# 系统配置应该总是使用 json 格式定义
# 使用时机: 当系统需要初始化一些系统稳定数据时使用, 例如角色, 用户等
# 参考: 角色配置链路
# 行为:
# 1. 任何系统配置不应当引发任何错误, 但是需要警告日志. 但是可以返回错误.
system:
  roleConfigPath:
  swaggerConfigPath:
